name: Visual Regression Test


# Триггеры: запуск при push и pull request
on: [push, pull_request]

jobs:
  visual-regression:
    # Запуск на последней версии Ubuntu
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Получение кода из репозитория
      - uses: actions/checkout@v4

      # Шаг 2: Установка системных зависимостей для Playwright на Ubuntu
      - name: Install system dependencies for Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libxfixes3 \
            libxcursor1 \
            libxss1 \
            libxtst6 \
            libpangocairo-1.0-0 \
            libatk1.0-0 \
            libgtk-3-0

      # Шаг 3: Установка Node.js (необходим для Playwright)
      - name: Set up Node.js for Playwright
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Шаг 4: Установка Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Шаг 5: Очистка кэша Maven
      - name: Clean Maven cache
        run: mvn dependency:purge-local-repository

      # Шаг 6: Кэширование Maven‑зависимостей
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('pom.xml') }}

      # Шаг 7: Кэширование браузеров Playwright
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}

      # Шаг 8: Разрешение зависимостей Maven без запуска тестов
      - name: Resolve dependencies
        run: mvn install -DskipTests

      # Шаг 9: Установка Playwright с системными зависимостями
      - name: Install Playwright with system dependencies
        run: npx playwright install --with-deps

      # Шаг 10: Подготовка эталонного скриншота
      # Если expected.png ещё не существует, он будет создан при первом успешном запуске
      - name: Prepare expected screenshot
        run: |
          mkdir -p visual-regression
          if [ -f "expected.png" ]; then
            cp expected.png visual-regression/expected.png
            echo "Expected screenshot copied to visual-regression/"
          else
            echo "Expected screenshot not found — will be created after first successful test run"
          fi

      # Шаг 11: Запуск теста визуальной регрессии
      - name: Run visual regression test
        run: mvn test -Dtest=CartTest#testHomePageVisual

      # Шаг 12: Загрузка артефактов (актуальный скриншот, diff, отчёт)
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-artifacts
          path: |
            visual-regression/
            target/surefire-reports/
          retention-days: 7



