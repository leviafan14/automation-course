name: Run Tests

# Триггеры: запуск при push и pull request для непрерывной интеграции
on: [push, pull_request]

jobs:
  test:
    # Запуск на последней версии Ubuntu
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Получение кода из репозитория
      - uses: actions/checkout@v4

      # Шаг 2: Установка Node.js (необходим для Playwright)
      - name: Set up Node.js for Playwright
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # Актуальная LTS-версия Node.js

      # Шаг 3: Очистка кэша Maven для предотвращения конфликтов зависимостей
      - name: Clean Maven cache
        run: mvn dependency:purge-local-repository

      # Шаг 4: Кэширование Maven‑зависимостей для ускорения сборок
      # Ключ кэша зависит от хэша pom.xml — кэш обновляется при изменении зависимостей
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('pom.xml') }}

      # Шаг 5: Кэширование браузеров Playwright для ускорения установки
      # Ключ зависит от ОС (Ubuntu в данном случае)
      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}

      # Шаг 6: Установка Java 17 (Temurin distribution — популярный дистрибутив OpenJDK)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Шаг 7: Разрешение зависимостей Maven без запуска тестов
      - name: Resolve dependencies
        run: mvn install -DskipTests

      # Шаг 8: Установка Playwright с системными зависимостями
      - name: Install Playwright with system dependencies
        run: npx playwright install --with-deps
        # Эта команда:
        # - устанавливает браузеры Playwright (Chromium, Firefox, WebKit)
        # - автоматически устанавливает недостающие системные библиотеки
        # - решает ошибку "Host system is missing dependencies"

      # Шаг 9: Настройка директорий для артефактов
      - name: Create artifact directories
        run: |
          mkdir -p screenshots/videos
          echo "Directories created for screenshots and videos"

      # Шаг 10: Запуск тестов с записью видео и скриншотов
      - name: Run tests with video recording and screenshots
        env:
          PLAYWRIGHT_VIDEO_DIR: videos/
          PLAYWRIGHT_SCREENSHOT_DIR: screenshots/
        run: mvn test -Dtest=SimpleInterceptionTest
        # Переменные окружения:
        # PLAYWRIGHT_VIDEO_DIR — директория для записи видео тестов
        # PLAYWRIGHT_SCREENSHOT_DIR — директория для сохранения скриншотов

      # Шаг 11: Загрузка видео как артефакт
      - name: Upload video recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos
          path: videos/
          retention-days: 7

      # Шаг 12: Загрузка скриншотов как артефакт
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: screenshots/
          retention-days: 7

      # Шаг 13: Загрузка результатов тестов как артефакт
      # Выполняется всегда (даже если тесты упали) для отладки
      # Сохраняет отчёты Surefire в артефакт с именем "test-results"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/


