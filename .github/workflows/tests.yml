name: Run Allure Report Test

on: [push, pull_request]


jobs:
  report-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Install system dependencies for Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libxfixes3 \
            libxcursor1 \
            libxss1 \
            libxtst6 \
            libpangocairo-1.0-0 \
            libatk1.0-0 \
            libgtk-3-0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run tests and generate Allure results
        run: mvn test -Dtest=CheckboxTest -Dallure.report.directory=target/allure-results

      - name: Install Allure CLI
        run: |
          wget -qO- https://github.com/allure-framework/allure2/releases/download/2.21.0/allure-2.21.0.zip > allure.zip
          unzip -q allure.zip -d /tmp
          echo "/tmp/allure-2.21.0/bin" >> $GITHUB_PATH

      - name: Generate Allure report
        run: |
          if [ ! -d "target/allure-results" ]; then
            echo "❌ Error: Allure results directory not found!"
            exit 1
          fi
          allure generate target/allure-results --clean -o target/allure-report
          if [ $? -ne 0 ]; then
            echo "❌ Error generating Allure report!"
            exit 1
          fi

      - name: Archive Allure report as ZIP
        run: zip -r allure-report.zip target/allure-report/

      - name: Upload Allure report artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report.zip
          retention-days: 30







