name: Run test
on: [push, pull_request]

jobs:
  report-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Install system dependencies for Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libxfixes3 \
            libxcursor1 \
            libxss1 \
            libxtst6 \
            libpangocairo-1.0-0 \
            libatk1.0-0 \
            libgtk-3-0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Create trace directory
        run: mkdir -p trace

      - name: Run test and generate report
        run: mvn test -Dtest=TestLoginPerformance

      - name: Debug: check report structure
        run: |
          echo "Папка test-reports существует:"
          ls -la test-reports/ 2>/dev/null || echo "Нет папки test-reports"
          echo "Скриншоты:"
          ls -la test-reports/screenshots/ 2>/dev/null || echo "Нет скриншотов"

      - name: Upload test results and screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_id }}
          path: test-reports/
          retention-days: 14










