name: Run Tests
# Триггеры: запуск при push и pull request для непрерывной интеграции
on: [push, pull_request]

jobs:
  test:
    # Запуск на последней версии Ubuntu
    runs-on: ubuntu-latest
    steps:
      # Шаг 1: Получение кода из репозитория
      - uses: actions/checkout@v4

      # Шаг 2: Установка Node.js (необходим для Playwright)
      - name: Set up Node.js for Playwright
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # Актуальная LTS-версия Node.js

      # Шаг 3: Очистка кэша Maven для предотвращения конфликтов зависимостей
      - name: Clean Maven cache
        run: mvn dependency:purge-local-repository

      # Шаг 4: Кэширование Maven-зависимостей для ускорения сборок
      # Ключ кэша зависит от хэша pom.xml — кэш обновляется при изменении зависимостей
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('pom.xml') }}

      # Шаг 5: Кэширование браузеров Playwright для ускорения установки
      # Ключ зависит от ОС (Ubuntu в данном случае)
      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}

      # Шаг 6: Установка Java 17 (Temurin distribution — популярный дистрибутив OpenJDK)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Шаг 7: Разрешение зависимостей Maven без запуска тестов
      - name: Resolve dependencies
        run: mvn install -DskipTests

      # Шаг 8: Установка Playwright с системными зависимостями
      - name: Install Playwright with system dependencies
        run: npx playwright install --with-deps
        # Эта команда:
        # - устанавливает браузеры Playwright (Chromium, Firefox, WebKit)
        # - автоматически устанавливает недостающие системные библиотеки
        # - решает ошибку "Host system is missing dependencies"

      # Шаг 9: Установка конкретного браузера Chromium через Maven (дополнительно)
      - name: Install Chromium via Maven (optional)
        run: mvn exec:java -Dexec.mainClass="com.microsoft.playwright.CLI" -Dexec.args="install chromium"
        # Примечание: обычно достаточно шага выше (npx playwright install)

      # Шаг 10: Запуск конкретного тестового класса ExampleTest
      - name: Run tests
        run: mvn test -Dtest=SimpleInterceptionTest

      # Шаг 11: Загрузка результатов тестов как артефакт
      # Выполняется всегда (даже если тесты упали) для отладки
      # Сохраняет отчёты Surefire в артефакт с именем "test-results"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/

