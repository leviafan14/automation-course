name: Run Allure, ExtentReports and Tracing Test

on: [push, pull_request]

jobs:
  report-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 23
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Install system dependencies for Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libxfixes3 \
            libxcursor1 \
            libxss1 \
            libxtst6 \
            libpangocairo-1.0-0 \
            libatk1.0-0 \
            libgtk-3-0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run tests with tracing enabled
        run: |
          mvn test \
            -Dtest=DynamicLoadingTraceTest 

      - name: Verify trace files exist
        run: |
          if [ ! -f "trace-dynamic-loading.zip" ]; then
            echo "Warning: Trace file not found (trace-dynamic-loading.zip)"
            touch trace-dynamic-loading.zip  # Создаём пустой файл для избежания ошибки
          else
            echo "Trace file found: trace-dynamic-loading.zip"
          fi

      - name: Archive trace files as ZIP
        run: zip -r trace-report.zip trace-dynamic-loading.zip

      - name: Upload trace artifact
        uses: actions/upload-artifact@v4
        with:
          name: trace-report
          path: trace-report.zip
          retention-days: 30







